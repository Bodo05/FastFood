<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Piatto - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- navbar comune a tutte le pagine -->
    <div id="navbar-placeholder"></div>
    <!-- toast box comune a tutte le pagine -->
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 id="formTitle" class="mb-4 text-center">Aggiungi Nuovo Piatto</h3>

                        <form id="formPiatto">
                            <div class="mb-3">
                                <label class="form-label">Nome Piatto</label>
                                <input type="text" id="nome" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Prezzo (€)</label>
                                <input type="number" step="0.01" id="prezzo" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Categoria</label>
                                <input type="text" id="categoria" class="form-control" placeholder="es. Pizza, Burger, Pasta...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">URL Immagine</label>
                                <input type="url" id="thumb" class="form-control" placeholder="https://...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descrizione / Ingredienti</label>
                                <textarea id="descrizione" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <!-- il submit viene controllato direttamente dal js -->
                                <button type="submit" id="btnSubmit" class="btn btn-primary">Aggiungi Piatto</button>
                                <a href="ristoratore.html" class="btn btn-outline-secondary">Annulla</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="creapiatto.js"></script>
</body>
</html>
