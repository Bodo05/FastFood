<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Piatti - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- navbar comune a tutte le pagine -->
    <div id="navbar-placeholder"></div>
    <!-- toast box comune a tutte le pagine -->
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Catalogo Piatti</h2>
            <a href="ristoratore.html" class="btn btn-outline-secondary">← Torna al Menu</a>
        </div>

        <!-- barra di ricerca -->
        <div class="row mb-4">
            <div class="col-md-8">
                <input type="text" id="inputRicerca" class="form-control" placeholder="Cerca un piatto nel catalogo...">
            </div>
            <div class="col-md-4">
                <button id="btnCerca" class="btn btn-primary w-100">Cerca</button>
            </div>
        </div>

        <!-- mostra risultati -->
        <div id="catalogoContainer" class="row g-3">
            <p class="text-muted text-center">Cerca un piatto per visualizzare i risultati dal catalogo.</p>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="catalogo.js"></script>
</body>
</html>
