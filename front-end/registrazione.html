<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-auth">
    <!-- navbar presente in ogni pagina -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">FastFood Project</span>
            <a href="login.html" class="btn btn-outline-light btn-sm">Torna al Login</a>
        </div>
    </nav>

    <!-- toast box per notifiche come in ogni pagina -->
    <div class="toast-box" id="toastPlaceHolder"></div>

    <!-- Form Registrazione -->
    <main class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <h2 class="text-center mb-4">Crea il tuo account</h2>

                <!-- scelta della tipologia utente in base al quale viene determinata la pagina -->
                <div class="d-flex justify-content-center mb-4">
                    <div class="btn-group">
                        <button class="btn btn-primary active" id="btnTabCliente" onclick="cambiaTab('cliente')">Cliente</button>
                        <button class="btn btn-outline-primary" id="btnTabRistoratore" onclick="cambiaTab('ristoratore')">Ristoratore</button>
                    </div>
                </div>

                <div class="card shadow">
                    <div class="card-body p-4">
                        
                        <!-- credenziali comuni a cliente e ristoratore -->
                        <h5 class="mb-3">Credenziali di Accesso</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="pass" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Conferma Password</label>
                                <input type="password" class="form-control" id="confPass" required>
                            </div>
                        </div>

                        <!-- sezione cliente di base sempre attiva, cambia con onclick sul bottore ristoratore -->
                        <div id="divCliente">
                            <div class="mb-3">
                                <label class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nome" placeholder="Mario">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cognome</label>
                                <input type="text" class="form-control" id="cognome" placeholder="Rossi">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Metodo di Pagamento</label>
                                <select class="form-select" id="metodoPagamento">
                                    <option value="">-- Seleziona --</option>
                                    <option value="carta_credito">Carta di Credito</option>
                                    <option value="prepagata">Carta Prepagata</option>
                                </select>
                            </div>
                            <div class="card p-3 mb-3 ">
                                <h6 class="mb-3">Dati Carta</h6>
                                <div class="mb-3">
                                    <label class="form-label small">Numero Carta (16 cifre) *</label>
                                    <input type="text" class="form-control" id="regNumeroCarta" placeholder="0000 0000 0000 0000" maxlength="16">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">CVV (3 cifre) *</label>
                                    <input type="text" class="form-control" id="regCVV" placeholder="123" maxlength="3">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Scadenza</label>
                                    <input type="text" class="form-control" id="regScadenza" placeholder="MM/YY" maxlength="5">
                                </div>
                            </div>

                         <div class="mb-3">
                            <label class="form-label">Preferenza Alimentare (Opzionale)</label>
                            <select class="form-select" id="prefCliente">
                                </select>
                        </div>
                    </div>

                        <!-- sezione ristoratore di base nascosta, si attiva premendo sul bottone ristoratore e si toglie la parte del cliente -->
                        <div id="divRistoratore" style="display: none;">
                            <h5 class="mb-3">Dati Attività</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Nome Ristorante</label>
                                    <input type="text" class="form-control" id="nomeRist">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Partita IVA (11 cifre)</label>
                                    <input type="text" class="form-control" id="piva">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Indirizzo</label>
                                    <input type="text" class="form-control" id="indirizzo" placeholder="Via Roma 10, Milano">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Telefono</label>
                                    <input type="text" class="form-control" id="telefono">
                                </div>
                            </div>

                            <!-- catalogo dei piatti  -->
                            <div class="alert alert-info">
                                <strong>Crea il tuo Menu:</strong> Seleziona una categoria e aggiungi i piatti.
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Filtra per Categoria</label>
                                <select id="filtroCatalogo" class="form-select">
                                    <option value="">-- Seleziona --</option>
                                </select>
                            </div>

                            <div id="containerPiatti" class="row g-3 mb-4" style="max-height: 400px; overflow-y: auto;">
                                <p class="text-muted text-center">Scegli una categoria per vedere i piatti.</p>
                            </div>

                            <div class="card bg-light">
                                <div class="card-body">
                                    <strong>Menu Selezionato:</strong>
                                    <div id="menuScelto" class="mt-2">
                                        <small class="text-muted">Nessun piatto aggiunto.</small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Pulsante Registrazione -->
                        <div class="d-grid mt-4">
                            <button class="btn btn-success btn-lg" id="btnRegistra" onclick="registrati()">
                                Registrati
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="registrazioneClienteRistoratore.js"></script>
</body>
</html>
