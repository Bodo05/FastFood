<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Profilo - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-placeholder"></div>
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <div class="row">
            <!-- Profilo -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">I tuoi Dati</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Cognome</label>
                            <input type="text" class="form-control" id="cognome">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Metodo Pagamento</label>
                            <select class="form-select" id="metodoPagamento">
                                <option value="carta_credito">Carta di Credito</option>
                                <option value="prepagata">Carta Prepagata</option>
                            </select>
                            </div>

                            <div class="card p-3 mb-3 border">
                            <h6 class="mb-2 text-primary">Dati Carta Salvati</h6>
                            <div class="mb-2">
                                <label class="form-label small">Numero Carta</label>
                                <input type="text" class="form-control" id="profNumeroCarta" maxlength="16">
                            </div>
                            <div class="row">
                                <div class="col-6">
                                    <label class="form-label small">CVV</label>
                                    <input type="text" class="form-control" id="profCVV" maxlength="3">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">Scadenza</label>
                                    <input type="text" class="form-control" id="profScadenza" maxlength="5">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoria Preferita</label>
                            <select class="form-select" id="categoriaPreferita">
                                <option value="">Caricamento...</option>
                            </select>
                        </div>

                        <button class="btn btn-success w-100 mb-2" onclick="aggiorna()">Salva</button>
                        <button class="btn btn-outline-danger w-100" onclick="elimina()">Elimina Account</button>
                    </div>
                </div>
            </div>

            <!-- Ordini -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Storico Ordini</h5>
                    </div>
                    <div class="list-group list-group-flush" id="storico" style="max-height: 500px; overflow-y: auto;">
                        <div class="list-group-item text-center">Caricamento...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="gestioneCliente.js"></script>
</body>
</html>
