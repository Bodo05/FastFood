<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profilo Cliente</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <div id="navbar-placeholder"></div>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastPlaceHolder" style="z-index: 1055;"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card p-4 mb-3 shadow-sm border-0">
                    <h4 class="mb-3 text-primary">Il tuo Profilo</h4>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Nome</label>
                        <input id="nome" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Cognome</label>
                        <input id="cognome" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Email</label>
                        <input id="email" class="form-control" disabled>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-muted">Categoria Preferita</label>
                        <select id="categoriaPreferita" class="form-select"></select>
                    </div>
                    <button class="btn btn-primary w-100 fw-bold mb-2" onclick="aggiorna()">Salva Modifiche</button>
                    <button class="btn btn-outline-danger w-100" onclick="elimina()">Elimina Account</button>
                </div>
            </div>
            <div class="col-md-8">
                <h4 class="mb-3">I Tuoi Ordini</h4>
                <div id="storico" class="list-group shadow-sm">
                    <div class="list-group-item text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="navbar.js"></script>
    <script src="gestioneCliente.js"></script>
</body>
</html>
