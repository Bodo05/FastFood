<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Profilo Ristorante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Fast Food - Area Ristoratore</span>
            <button class="btn btn-outline-light btn-sm" id="btnLogout">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Gestione Profilo Ristorante</h4>
                    </div>
                    <div class="card-body">
                        <form id="formProfilo">
                            <div class="mb-3">
                                <label for="nomeRistorante" class="form-label">Nome Ristorante</label>
                                <input type="text" class="form-control" id="nomeRistorante" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="indirizzo" class="form-label">Indirizzo</label>
                                <input type="text" class="form-control" id="indirizzo" required>
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">Telefono</label>
                                <input type="tel" class="form-control" id="telefono">
                            </div>

                            <div class="mb-3">
                                <label for="piva" class="form-label">Partita IVA</label>
                                <input type="text" class="form-control" id="piva" required>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <button type="submit" class="btn btn-success">Salva Modifiche</button>
                                <button type="button" class="btn btn-danger" id="btnElimina">Elimina Account</button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="mt-3 text-center">
                    <a href="ristoratore.html" class="btn btn-secondary">Torna alla Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script src="profilo-ristoratore.js"></script>
</body>
</html>
