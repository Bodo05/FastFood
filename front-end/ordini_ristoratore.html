<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordini Ristoratore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- navbar comune a tutte le pagine -->
    <div id="navbar-placeholder"></div>
    <!-- toast box comune a tutte le pagine -->
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Coda Ordini</h3>
            <span id="orologio" class="badge bg-dark fs-6 p-2"></span>
        </div>

        <!-- contenitore vuoto che sarà riempito con gli ordini -->
        <div id="containerOrdini" class="row g-3">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">Caricamento ordini...</p>
            </div>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="ordini_ristoratore.js"></script>
</body>
</html>
