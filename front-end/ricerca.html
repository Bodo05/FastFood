<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- navbar comune a ogni pagina -->
    <div id="navbar-placeholder"></div>

    <!-- toast box comune a ogni pagina -->
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <h2 class="text-center mb-4">Cosa vuoi mangiare oggi?</h2>

        <!-- barra di ricerca per scegliere la tipologia di ricerca -->
        <div class="card p-4 mb-4 shadow-sm">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <select class="form-select" id="tipoRicerca" onchange="aggiornaInterfacciaRicerca()">
                        <optgroup label="Ricerca Ristoranti">
                            <option value="rist_nome">Nome Ristorante</option>
                            <option value="rist_luogo">Luogo</option>
                            <option value="rist_piatto">Piatto</option> </optgroup>
                        <optgroup label="Ricerca Piatti">
                            <option value="piatto_nome">Nome Piatto</option>
                            <option value="piatto_tipo">Categoria</option>
                            <option value="piatto_prezzo">Prezzo</option>
                            <option value="piatto_ingrediente">Ingrediente</option> 
                            <option value="piatto_allergie">Allergie (Esclusione)</option> </optgroup>
                    </select>
                </div>
                <div class="col-md-6" id="divInputTesto">
                    <input type="text" class="form-control" id="inputRicerca" placeholder="Cerca...">
                </div>

                <div class="col-md-6" id="divInputPrezzo" style="display: none;">
                    <div class="input-group">
                        <span class="input-group-text">Min €</span>
                        <input type="number" id="minPrezzo" class="form-control" placeholder="0">
                        <span class="input-group-text">Max €</span>
                        <input type="number" id="maxPrezzo" class="form-control" placeholder="50">
                    </div>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="eseguiRicerca()">Cerca</button>
                </div>
            </div>
        </div>
        
        <!-- div che permette di mostrare i risultati della ricerca -->
        <div id="containerRisultati" class="row g-4">
            <p class="text-center text-muted mt-5">I risultati appariranno qui.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="ricerca.js"></script>
</body>
</html>
