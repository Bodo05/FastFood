<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-placeholder"></div>
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <h2 class="text-center mb-4">Cosa vuoi mangiare oggi?</h2>

        <!-- barra di ricerca per scegliere la tipologia di ricerca -->
        <div class="card p-4 mb-4 shadow-sm">
            <div class="row g-2">
                <div class="col-md-3">
                    <select class="form-select" id="tipoRicerca" onchange="aggiornaPlaceholder()">
                        <option value="generale">Tutto</option>
                        <option value="ingrediente">Per Ingrediente</option>
                        <option value="ristorante">Per Ristorante</option>
                        <option value="luogo">Per Città</option>
                        <option value="allergene">Escludi Allergene</option>
                        <option value="piatto_ristorante">Chi fa questo piatto?</option>
                    </select>
                </div>
                <div class="col-md-7">
                    <input type="text" class="form-control" id="inputRicerca" placeholder="Cerca...">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="eseguiRicerca()">Cerca</button>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary"></div>
        </div>

        <!-- div che permette di mostrare i risultati della ricerca -->
        <div id="containerRisultati" class="row g-4">
            <p class="text-center text-muted mt-5">I risultati appariranno qui.</p>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="ricerca.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
