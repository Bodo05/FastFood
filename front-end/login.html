<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-auth">
    <!-- navbar comune a ogni pagina -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">FastFood Project</span>
        </div>
    </nav>

    <!-- toastbox per notifiche comune a ogni pagina -->
    <div class="toast-box" id="toastPlaceHolder"></div>

    <!-- form login -->
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Accedi</h3>

                        <form id="loginForm">
                            <!-- tipo utente con radio button -->
                            <div class="mb-3 text-center">
                                <div class="btn-group">
                                    <input type="radio" class="btn-check" name="userType" id="tipoCliente" value="cliente" checked>
                                    <label class="btn btn-outline-primary" for="tipoCliente">Cliente</label>

                                    <input type="radio" class="btn-check" name="userType" id="tipoRistoratore" value="ristoratore">
                                    <label class="btn btn-outline-primary" for="tipoRistoratore">Ristoratore</label>
                                </div>
                            </div>

                            <!-- campo inserimento email -->
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <!-- campo inserimento password -->
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>

                            <!-- pulsante di invio -->
                            <button type="submit" class="btn btn-primary w-100" id="btnLogin">Accedi</button>
                        </form>

                        <!-- link che riporta alla pagina di registrazione -->
                        <hr>
                        <p class="text-center mb-0">
                            Non hai un account? <a href="registrazione.html">Registrati</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
