<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Ristoratore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- navbar dinamica comune a tutti i file -->
    <div id="navbar-placeholder"></div>
    <!-- toast box per notifiche comune a tutti i file -->
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Il tuo Menu</h2>
            <div>
                <!-- bottoni che se premuti riportano a pagine specifiche per aggiungere piatti
                 al proprio menu -->
                <a href="catalogo.html" class="btn btn-outline-primary me-2">Da Catalogo</a>
                <a href="creapiatto.html" class="btn btn-success">Nuovo Piatto</a>
            </div>
        </div>

        <!-- griglia che contiene i piatti del proprio menu -->
        <div id="menuContainer" class="row g-3">
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
            </div>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="ristoratore.js"></script>
</body>
</html>
