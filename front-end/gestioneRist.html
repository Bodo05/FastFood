<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo Ristoratore - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-placeholder"></div>
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Gestione Profilo</h5>
                    </div>
                    <div class="card-body">
                        <form id="formProfilo">
                            <div class="mb-3">
                                <label class="form-label">Nome Ristorante *</label>
                                <input type="text" class="form-control" id="nomeRistorante" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Indirizzo *</label>
                                <input type="text" class="form-control" id="indirizzo" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Telefono</label>
                                <input type="text" class="form-control" id="telefono">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Partita IVA (11 cifre) *</label>
                                <input type="text" class="form-control" id="piva" required>
                            </div>

                            <button type="submit" class="btn btn-success w-100 mb-2">Salva Modifiche</button>
                        </form>

                        <hr>
                        <button class="btn btn-outline-danger w-100" id="btnElimina">
                            Elimina Account
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="gestioneRist.js"></script>
</body>
</html>
