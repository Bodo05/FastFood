<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Profilo Ristorante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div id="navbar-placeholder"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0"><i class="bi bi-person-gear"></i> Modifica Profilo Ristorante</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="formProfilo">
                            <div class="mb-3">
                                <label for="nomeRistorante" class="form-label fw-bold">Nome Ristorante</label>
                                <input type="text" class="form-control" id="nomeRistorante" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email di contatto</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="indirizzo" class="form-label fw-bold">Indirizzo Sede</label>
                                <input type="text" class="form-control" id="indirizzo" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="telefono" class="form-label fw-bold">Telefono</label>
                                    <input type="tel" class="form-control" id="telefono">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="piva" class="form-label fw-bold">Partita IVA</label>
                                    <input type="text" class="form-control" id="piva" required>
                                </div>
                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-between align-items-center">
                                <button type="submit" class="btn btn-success px-4 fw-bold">Salva Modifiche</button>
                                <button type="button" class="btn btn-outline-danger btn-sm" id="btnElimina">Elimina Account</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="navbar.js"></script>
    
    <script src="gestioneRist.js"></script>
</body>
</html>
