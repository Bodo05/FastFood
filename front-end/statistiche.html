<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiche - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- navbar dinamica comune a tutti i file -->
    <div id="navbar-placeholder"></div>
    <!-- toast box dinamico  comune a tutti i file -->
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <h2 class="mb-4">Statistiche Vendite</h2>

        <!-- card delle statistiche, una per i guadagni e una per il numero di ordini completati -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card text-white bg-success">
                    <div class="card-header">Guadagni Totali</div>
                    <div class="card-body text-center">
                        <h1 class="display-4">€<span id="totaleGuadagni">0.00</span></h1>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-white bg-info">
                    <div class="card-header">Ordini Completati</div>
                    <div class="card-body text-center">
                        <h1 class="display-4" id="numeroOrdini">0</h1>
                    </div>
                </div>
            </div>
        </div>

        <!-- card per la classifica dei piatti piu venduti -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Piatti più Venduti</h5>
            </div>
            <ul class="list-group list-group-flush" id="listaPopolari">
                <li class="list-group-item text-muted text-center">Caricamento...</li>
            </ul>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="statistiche.js"></script>
</body>
</html>
