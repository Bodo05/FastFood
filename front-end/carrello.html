<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello - FastFood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="navbar-placeholder"></div>
    <div class="toast-box" id="toastPlaceHolder"></div>

    <main class="container mt-4">
        <h3 class="mb-4">Il Tuo Carrello</h3>
        
        <!-- Lista piatti nel carrello -->
        <div id="carrelloContainer" class="mb-4"></div>

        <!-- Azioni carrello -->
        <div id="azioniCarrello" class="card mb-4" style="display: none;">
            <div class="card-body d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Totale: €<span id="totale">0.00</span></h4>
                <div>
                    <button class="btn btn-outline-danger me-2" onclick="svuotaCarrello()">Svuota</button>
                    <button class="btn btn-success" onclick="mostraCheckout()">Procedi all'ordine</button>
                </div>
            </div>
        </div>

        <!-- Sezione Checkout -->
        <div id="checkoutSection" class="card border-primary mb-5" style="display: none;">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Completa l'ordine</h5>
            </div>
            <div class="card-body">
                <form id="formOrdine" onsubmit="event.preventDefault(); inviaOrdine();">
                    
                    <!-- Tipo consegna -->
                    <div class="mb-3">
                        <label class="form-label">Tipo consegna:</label>
                        <div class="btn-group w-100">
                            <input type="radio" class="btn-check" name="tipoConsegna" id="btnDomicilio" value="domicilio" checked onchange="toggleIndirizzo()">
                            <label class="btn btn-outline-primary" for="btnDomicilio">🏠 Domicilio</label>

                            <input type="radio" class="btn-check" name="tipoConsegna" id="btnAsporto" value="asporto" onchange="toggleIndirizzo()">
                            <label class="btn btn-outline-primary" for="btnAsporto">🛍️ Asporto</label>
                        </div>
                    </div>

                    <!-- Indirizzo (solo domicilio) -->
                    <div class="mb-3" id="divIndirizzo">
                        <label class="form-label">Indirizzo di consegna</label>
                        <input type="text" class="form-control" id="indirizzo" placeholder="Via Roma 10, Milano" onblur="calcolaPreventivo()">
                    </div>

                    <!-- Preventivo -->
                    <div id="boxPreventivo" class="alert alert-warning" style="display: none;">
                        <h6 class="fw-bold">Riepilogo costi</h6>
                        <hr>
                        <div class="d-flex justify-content-between"><span>Preparazione:</span><span id="prevPrep">-</span></div>
                        <div class="d-flex justify-content-between"><span>Tempo viaggio:</span><span id="prevViaggio">-</span></div>
                        <div class="d-flex justify-content-between text-danger"><span>Costo spedizione:</span><span id="prevCosto">-</span></div>
                        <div class="d-flex justify-content-between fw-bold fs-5 mt-2 pt-2 border-top">
                            <span>TOTALE FINALE:</span><span id="prevTotale">-</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold" id="btnPaga" disabled>
                        CONFERMA ORDINE
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="utils.js"></script>
    <script src="navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="carrello.js"></script>
</body>
</html>
